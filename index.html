  <script>
'use strict';

/* Helfer: Preise lesen, Farben erkennen */

/** "€ 1.299,90" / "1,299.90" / "129.9" / 12990 (cents) -> Number */
function parsePrice(input) {
  if (input == null) return null;
  if (typeof input === 'number') return Number.isFinite(input) ? input : null;
  let s = String(input).replace(/[^\d.,-]/g, '');
  if (!s) return null;
  const lastComma = s.lastIndexOf(',');
  const lastDot = s.lastIndexOf('.');
  if (lastComma > lastDot) {
    // Deutsches Format: 1.299,90
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (lastDot > lastComma && lastComma !== -1) {
    // Englisches Format: 1,299.90
    s = s.replace(/,/g, '');
  } else if (lastComma === -1 && /^\d{1,3}(\.\d{3})+$/.test(s)) {
    // "1.299" -> Tausendertrenner
    s = s.replace(/\./g, '');
  }
  const n = parseFloat(s);
  return Number.isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : null;
}

// Farbwörter (EN -> DE-Synonyme), damit "Black" auch "schwarz" matcht
const COLORS = {
  black: ['black', 'schwarz', 'noir', 'nero'],
  white: ['white', 'weiss', 'weiß', 'blanc', 'bianco'],
  red: ['red', 'rot', 'rouge'],
  blue: ['blue', 'blau', 'bleu'],
  green: ['green', 'grün', 'gruen', 'vert'],
  yellow: ['yellow', 'gelb'],
  orange: ['orange'],
  purple: ['purple', 'lila', 'violett', 'violet'],
  pink: ['pink', 'rosa', 'rose'],
  grey: ['grey', 'gray', 'grau', 'silver', 'silber'],
  gold: ['gold'],
  beige: ['beige', 'sand', 'cream', 'creme'],
  brown: ['brown', 'braun'],
  cyan: ['cyan', 'türkis', 'turquoise', 'teal'],
};
function normalize(s) {
  return String(s || '')
    .toLowerCase()
    .replace(/ß/g, 'ss')
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

const COLOR_WORDS = new Map();
for (const [key, words] of Object.entries(COLORS)) for (const w of words) COLOR_WORDS.set(normalize(w), key);

function tokens(s) {
  return normalize(s).split(' ').filter((t) => t.length > 1 || /\d/.test(t));
}

/** Liefert Farb-Schlüssel (z.B. "black") zu allen Farbwörtern im Text */
function colorKeys(s) {
  const keys = new Set();
  for (const t of normalize(s).split(' ')) {
    const k = COLOR_WORDS.get(t);
    if (k) keys.add(k);
  }
  return keys;
}

/** Findet eine Farbangabe im Text (erste Farbe), z.B. für Titel ohne explizite Variante */
function detectColor(s) {
  const words = String(s || '').split(/[\s/,()|\-–]+/);
  for (const w of words) {
    if (COLOR_WORDS.has(normalize(w))) return w;
  }
  return null;
}

function formatEur(n) {
  return n == null ? '—' : new Intl.NumberFormat('de-AT', { style: 'currency', currency: 'EUR' }).format(n);
}

const WLUtil = { parsePrice, normalize, tokens, colorKeys, detectColor, formatEur };
window.WLUtil = WLUtil;

'use strict';

/*
 * Produktdaten direkt aus dem Link:
 *   - die Shopseite wird über einen CORS-Proxy geladen
 *   - die Wunschliste liegt im localStorage des Browsers
 */
(() => {
  const { parsePrice, colorKeys, detectColor } = window.WLUtil;

  const KEY = 'wunschliste.items';
  /*
   * Nur nötig, wenn die Seite NICHT auf dem Cloudflare Worker läuft (z.B. GitHub Pages):
   * dann hier die Worker-Adresse eintragen, z.B. 'https://w.deinname.workers.dev'.
   * Auf *.workers.dev wird der eingebaute Proxy automatisch benutzt.
   */
  const EIGENER_PROXY = '';

  const COLOR_OPTION = /^(farbe|color|colour|colou?rway|farbvariante|design)$/i;

  const PROXIES = [
    (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
    (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  ];

  /* ------------------------------------------------------------ Speicher */

  /*
   * Die Listen liegen im Browser (localStorage) als schneller Zwischenspeicher.
   * Mit Login werden sie zusätzlich im Worker gespeichert (pro Benutzer) und so auf allen Geräten abgeglichen.
   * Ohne Worker (z.B. lokal geöffnet) gibt es kein Login, dann bleibt alles nur im Browser.
   */
  const DEFAULT_LISTS = [{ id: 'main', name: 'Main' }];
  const SESSION_KEY = 'wunschliste.session';
  const MIGRATED_KEY = 'wunschliste.migrated';

  // Speicherplätze ohne Login (alter Stand: "Main" nutzt 'wunschliste.items')
  const legacyKeys = () => ({
    lists: 'wunschliste.lists',
    active: 'wunschliste.active',
    items: (lid) => (lid === 'main' ? KEY : `${KEY}.${lid}`),
  });
  // Speicherplätze pro Benutzer
  const userKeys = (user) => {
    const p = `wunschliste.u.${user.toLowerCase()}.`;
    return { lists: `${p}lists`, active: `${p}active`, items: (lid) => `${p}items.${lid}` };
  };

  function read(key, fallback) {
    try {
      return JSON.parse(localStorage.getItem(key)) ?? fallback;
    } catch {
      return fallback;
    }
  }
  function write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch {
      /* privater Modus o.ä. */
    }
  }

  let keys = legacyKeys();
  let lists = [];
  let activeId = 'main';

  function openStore(k) {
    keys = k;
    lists = read(keys.lists, null);
    if (!Array.isArray(lists) || !lists.length) {
      lists = DEFAULT_LISTS.map((l) => ({ ...l }));
      write(keys.lists, lists);
    }
    activeId = read(keys.active, lists[0].id);
    if (!lists.some((l) => l.id === activeId)) activeId = lists[0].id;
  }
  openStore(legacyKeys());

  function load(lid = activeId) {
    const items = read(keys.items(lid), []);
    return Array.isArray(items) ? items : [];
  }
  function save(items, lid = activeId) {
    write(keys.items(lid), items);
    changed();
  }

  // gesamter Stand eines Speichers (für den Abgleich mit dem Worker)
  function snapshot(k = keys) {
    const ls = read(k.lists, null) || lists;
    const items = {};
    for (const l of ls) {
      const it = read(k.items(l.id), []);
      items[l.id] = Array.isArray(it) ? it : [];
    }
    return { lists: ls, active: read(k.active, activeId), items };
  }
  function applySnapshot(data, k = keys) {
    if (!data || !Array.isArray(data.lists) || !data.lists.length) return;
    write(k.lists, data.lists);
    if (data.active) write(k.active, data.active);
    for (const l of data.lists) write(k.items(l.id), (data.items && data.items[l.id]) || []);
    if (k === keys) openStore(k);
  }

  /* ---- Konto / Abgleich ---- */

  let session = read(SESSION_KEY, null);
  let online = false; // läuft die Seite auf dem Worker (mit /api)?
  let pushTimer = null;
  let onSessionLost = () => {};

  const authHeader = () => ({ Authorization: `Bearer ${encodeURIComponent(session.user)}:${session.token}` });

  async function call(path, { method = 'GET', body, auth = false } = {}) {
    const res = await fetch(`api/${path}`, {
      method,
      headers: { 'Content-Type': 'application/json', ...(auth ? authHeader() : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && auth) {
      session = null;
      try {
        localStorage.removeItem(SESSION_KEY);
      } catch {}
      onSessionLost();
    }
    if (!res.ok) throw new Error(data.error || `fehler ${res.status}`);
    return data;
  }

  // Änderung merken und kurz danach zum Worker schicken
  // Merker: gibt es Änderungen, die noch nicht beim Worker sind? (überlebt Neuladen/Schließen)
  const dirtyKey = () => `wunschliste.u.${session.user.toLowerCase()}.dirty`;
  const isDirty = () => !!session && !!read(dirtyKey(), null);

  function changed() {
    if (!online || !session) return;
    write(dirtyKey(), Date.now());
    clearTimeout(pushTimer);
    pushTimer = setTimeout(push, 700);
  }
  async function push() {
    clearTimeout(pushTimer);
    pushTimer = null;
    if (!online || !session) return;
    const mark = read(dirtyKey(), null);
    try {
      await call('data', { method: 'PUT', body: { data: snapshot() }, auth: true });
      // nur löschen, wenn inzwischen nichts Neues dazugekommen ist
      if (read(dirtyKey(), null) === mark) localStorage.removeItem(dirtyKey());
    } catch {
      /* Merker bleibt -> nächster Versuch beim nächsten Öffnen oder der nächsten Änderung */
    }
  }
  // Seite wird geschlossen/verlassen: ausstehende Änderung sofort schicken
  function flush() {
    if (!online || !session || !pushTimer) return;
    clearTimeout(pushTimer);
    pushTimer = null;
    try {
      fetch('api/data', {
        method: 'PUT',
        keepalive: true,
        headers: { 'Content-Type': 'application/json', ...authHeader() },
        body: JSON.stringify({ data: snapshot() }),
      }).catch(() => {});
    } catch {}
  }
  addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => document.hidden && flush());

  async function detect() {
    try {
      const res = await fetch('api/ping', { signal: AbortSignal.timeout(5000) });
      online = res.ok && (await res.json()).ok === true;
    } catch {
      // kein Netz (z.B. App offline gestartet): mit Sitzung trotzdem die eigenen Listen aus dem Zwischenspeicher zeigen
      online = !!session;
    }
    if (online && session) openStore(userKeys(session.user));
    return { online, user: session?.user || null };
  }

  // neueste Listen vom Worker holen (Worker ist die Wahrheit)
  async function pull() {
    if (!online || !session) return false;
    // eigene, noch nicht hochgeladene Änderungen gewinnen: erst schicken statt überschreiben
    if (isDirty()) {
      await push();
      if (isDirty()) return false;
    }
    const { data } = await call('data', { auth: true });
    if (data) applySnapshot(data);
    return true;
  }

  async function signIn(user) {
    const res = await call('login', { method: 'POST', body: { user } });
    session = { user: res.user, token: res.token };
    write(SESSION_KEY, session);
    openStore(userKeys(session.user));
    let migrated = false;
    if (res.empty) {
      // neues/leeres Konto: bisherige Listen aus diesem Browser übernehmen (einmalig)
      const legacy = snapshot(legacyKeys());
      const hasLegacy = Object.values(legacy.items).some((it) => it.length) || legacy.lists.length > 1;
      if (hasLegacy && !read(MIGRATED_KEY, null)) {
        applySnapshot(legacy);
        write(MIGRATED_KEY, session.user);
        migrated = true;
      }
      await push();
    } else await pull();
    return { user: session.user, migrated };
  }

  async function signOut() {
    try {
      if (session) await call('logout', { method: 'POST', body: {}, auth: true });
    } catch {}
    session = null;
    try {
      localStorage.removeItem(SESSION_KEY);
    } catch {}
    openStore(legacyKeys());
  }

  /* ---- Listen verwalten ---- */

  const getLists = () => lists.map((l) => ({ ...l, count: load(l.id).length }));
  const getActive = () => lists.find((l) => l.id === activeId);

  function switchTo(id) {
    if (!lists.some((l) => l.id === id)) throw new Error('liste nicht gefunden');
    activeId = id;
    write(keys.active, id);
    changed();
  }

  function createList(name) {
    name = String(name || '').trim().slice(0, 40);
    if (!name) throw new Error('name fehlt');
    if (lists.some((l) => l.name.toLowerCase() === name.toLowerCase())) throw new Error(`"${name}" gibt es schon`);
    const base = name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'liste';
    let id = base;
    for (let n = 2; lists.some((l) => l.id === id) || id === 'main'; n++) id = `${base}-${n}`;
    lists.push({ id, name });
    write(keys.lists, lists);
    changed();
    return { id, name };
  }

  function renameList(id, name) {
    name = String(name || '').trim().slice(0, 40);
    if (!name) throw new Error('name fehlt');
    const l = lists.find((x) => x.id === id);
    if (!l) throw new Error('liste nicht gefunden');
    if (lists.some((x) => x.id !== id && x.name.toLowerCase() === name.toLowerCase())) throw new Error(`"${name}" gibt es schon`);
    l.name = name;
    write(keys.lists, lists);
    changed();
  }

  function deleteList(id) {
    if (lists.length <= 1) throw new Error('die letzte liste kann nicht gelöscht werden');
    lists = lists.filter((l) => l.id !== id);
    write(keys.lists, lists);
    try {
      localStorage.removeItem(keys.items(id));
    } catch {}
    if (activeId === id) switchTo(lists[0].id);
    changed();
  }

  // Preis stammt aus den Produktdaten des Shops (sicher) – alles andere ist geraten
  const RELIABLE = ['shopify', 'amazon', 'woocommerce', 'json-ld', 'microdata', 'meta-tags'];
  const isReliable = (source) => RELIABLE.includes(source);

  /* ------------------------------------------------------------ Abruf */

  function proxies() {
    if (EIGENER_PROXY) return [(u) => `${EIGENER_PROXY.replace(/\/+$/, '')}/proxy?url=${encodeURIComponent(u)}`];
    // Läuft die Seite auf dem Cloudflare Worker, gibt es den Proxy unter /proxy auf derselben Adresse
    if (/\.workers\.dev$|(^|\.)dnoadrian\.at$/.test(location.hostname)) return [(u) => `proxy?url=${encodeURIComponent(u)}`];
    return PROXIES;
  }

  // Alle Proxys gleichzeitig fragen, die schnellste Antwort gewinnt
  let fastest = null;
  async function fetchText(url) {
    const list = proxies();
    const ctrls = list.map(() => new AbortController());
    const attempt = async (p, i) => {
      // eigener Worker (1 Proxy) darf etwas länger brauchen als die öffentlichen
      const timer = setTimeout(() => ctrls[i].abort(), list.length === 1 ? 16000 : 10000);
      try {
        const res = await fetch(p(url), { signal: ctrls[i].signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        if (text.length < 50) throw new Error('leere antwort');
        return [text, i];
      } finally {
        clearTimeout(timer);
      }
    };
    // der zuletzt schnellste Proxy bekommt einen kleinen Vorsprung
    const tries = list.map((p, i) =>
      i === fastest || fastest == null
        ? attempt(p, i)
        : new Promise((r) => setTimeout(r, 1500)).then(() => attempt(p, i)),
    );
    try {
      const [text, i] = await Promise.any(tries);
      fastest = i;
      ctrls.forEach((c, j) => j !== i && c.abort());
      return text;
    } catch (e) {
      const why = (e.errors || []).map((x) => (x.name === 'AbortError' ? 'timeout' : x.message)).join(', ');
      throw new Error(
        EIGENER_PROXY
          ? `shop nicht erreichbar (${why})`
          : `öffentliche proxys blockiert (${why}) – seite über den cloudflare worker öffnen`,
      );
    }
  }

  const parse = (html) => new DOMParser().parseFromString(html, 'text/html');
  const text = (el) => (el ? el.textContent.replace(/\s+/g, ' ').trim() : '');
  const meta = (doc, k) =>
    doc.querySelector(`meta[property="${k}"]`)?.content || doc.querySelector(`meta[name="${k}"]`)?.content || null;
  const abs = (src, base) => {
    if (!src) return null;
    try {
      return new URL(src.startsWith('//') ? `https:${src}` : src, base).href;
    } catch {
      return null;
    }
  };
  const strip = (o) => {
    for (const k of Object.keys(o)) if (o[k] == null || o[k] === '') delete o[k];
    return o;
  };

  /* ------------------------------------------------------------ Produkt */

  // Farbe direkt aus dem Link lesen (Slug oder Parameter wie ?color=white)
  function colorFromUrl(url) {
    try {
      const u = new URL(url);
      const raw = decodeURIComponent(`${u.pathname} ${[...u.searchParams.values()].join(' ')}`);
      return detectColor(raw.replace(/[-_/+=&.]/g, ' '));
    } catch {
      return null;
    }
  }

  async function extractProduct(url) {
    const u = new URL(url);
    const isProductPath = /\/products\/[^/?#]+/.test(u.pathname);
    // Shopify-Daten parallel zur Seite laden statt danach
    const shopify = isProductPath ? extractShopify(u).catch(() => null) : null;
    const html = await fetchText(url);
    const doc = parse(html);
    let p = {};

    // Reihenfolge: genaueste Quelle zuerst, spätere füllen nur Lücken
    const shopifyData = strip((await shopify) || {});
    if (shopifyData.price != null) shopifyData.currency = shopifyCurrency(html, doc);
    const sources = [
      shopifyData, // Shopify-kompatible Shops (auch ohne "shopify" im HTML)
      /amazon\./i.test(u.hostname) ? strip(extractAmazon(doc)) : {},
      fromWooVariations(doc, u),
      fromJsonLd(doc, u),
      fromMicrodata(doc),
      strip({
        title: meta(doc, 'og:title') || meta(doc, 'twitter:title'),
        brand: meta(doc, 'product:brand'),
        color: meta(doc, 'product:color'),
        image: meta(doc, 'og:image') || meta(doc, 'og:image:secure_url') || meta(doc, 'twitter:image'),
        price: parsePrice(
          meta(doc, 'product:price:amount') || meta(doc, 'og:price:amount') || meta(doc, 'twitter:data1'),
        ),
        currency: currencyOf(
          meta(doc, 'product:price:currency') || meta(doc, 'og:price:currency') || meta(doc, 'twitter:data1'),
        ),
      }),
      fromEmbeddedJson(doc, u),
      fromDom(doc),
      fromJsonRegex(`${html}\n${nextFlight(doc).text}`, u),
      fromText(doc),
    ];
    // Liefert eine genaue Quelle schon einen Euro-Preis (z.B. Shop-Preis für Österreich),
    // hat der Vorrang vor Umrechnen: Shops runden und rechnen mit eigenem Kurs
    // Nur wenn die genaueste Quelle eine bekannte Fremdwährung hat (sonst ginge z.B. der Variantenpreis verloren)
    const first = sources.find((x) => x.price != null);
    const SOURCE_NAMES = ['shopify', 'amazon', 'woocommerce', 'json-ld', 'microdata', 'meta-tags', 'seiten-daten', 'preisfeld', 'seiten-code', 'seitentext'];
    const eurSource =
      first && first.currency && first.currency !== 'EUR'
        ? sources.slice(0, 6).find((x) => x.price != null && x.currency === 'EUR')
        : null;
    if (eurSource) {
      p.price = eurSource.price;
      p.currency = 'EUR';
      p.priceSource = SOURCE_NAMES[sources.indexOf(eurSource)];
    }
    for (const src of sources) {
      const { price, currency, ...rest } = src;
      // Preis und Währung immer aus derselben Quelle übernehmen
      if (p.price == null && price != null) {
        p.price = price;
        p.currency = currency || null;
        p.priceSource = SOURCE_NAMES[sources.indexOf(src)];
      }
      p = { ...rest, ...p };
    }
    if (p.price != null && !p.currency) p.currency = currencyOf(meta(doc, 'product:price:currency') || meta(doc, 'og:price:currency')) || guessCurrency(html, doc);

    if (!p.title) p.title = text(doc.querySelector('title')) || titleFromUrl(u);
    if (!p.color) p.color = colorFromUrl(url) || detectColor(p.title);
    if (!p.title) throw new Error('kein produkt auf der seite gefunden');

    return {
      title: String(p.title).replace(/\s+/g, ' ').trim(),
      brand: p.brand || null,
      color: p.color || null,
      image: abs(p.image, url),
      price: p.price ?? null,
      currency: p.currency || 'EUR',
      priceSource: p.priceSource || null,
      gtin: p.gtin || null,
      mpn: p.mpn || null,
      shop: u.hostname.replace(/^www\./, ''),
      url,
    };
  }

  /* ---- Fallbacks für Shops ohne JSON-LD / OpenGraph ---- */

  // schema.org Microdata: itemprop="name" / "price" / "image"
  function fromMicrodata(doc) {
    const scope = doc.querySelector('[itemtype*="schema.org/Product"]') || doc;
    const prop = (name) => {
      const el = scope.querySelector(`[itemprop="${name}"]`);
      if (!el) return null;
      return el.getAttribute('content') || el.getAttribute('src') || el.getAttribute('href') || text(el);
    };
    if (!doc.querySelector('[itemprop]')) return {};
    return strip({
      title: prop('name'),
      brand: prop('brand'),
      color: prop('color'),
      image: prop('image'),
      price: parsePrice(prop('price') || prop('lowPrice')),
      currency: currencyOf(prop('priceCurrency')) || currencyOf(text(scope.querySelector('[itemprop="price"]'))),
    });
  }

  // Shops, die ihre Daten als JSON in die Seite schreiben (Next.js, Nuxt, Vue, eigene SPAs …)
  // Next.js (App Router) schreibt die Seitendaten als Datenstrom: self.__next_f.push([1,"…"])
  function nextFlight(doc) {
    let text = '';
    const objects = [];
    doc.querySelectorAll('script').forEach((s) => {
      const t = s.textContent;
      if (!t.includes('__next_f')) return;
      for (const m of t.matchAll(/self\.__next_f\.push\(\[\s*\d+\s*,\s*("(?:[^"\\]|\\.)*")\s*\]\)/g)) {
        try {
          text += JSON.parse(m[1]);
        } catch {}
      }
    });
    if (!text) return { text, objects };
    // Zeilen wie  3:{"product":{…}}  oder  1a:["$","div",null,{…}]
    for (const line of text.split('\n')) {
      const m = line.match(/^[0-9a-z]+:(?:[A-Z])?([[{][\s\S]*)$/);
      if (!m) continue;
      try {
        objects.push(JSON.parse(m[1]));
      } catch {}
    }
    return { text, objects };
  }

  function fromEmbeddedJson(doc, u) {
    const blobs = [...nextFlight(doc).objects];
    doc.querySelectorAll('script').forEach((s) => {
      const t = s.textContent.trim();
      if (!t || t.length > 3e6) return;
      const type = (s.getAttribute('type') || '').toLowerCase();
      if (type.includes('json') && !type.includes('ld+json')) blobs.push(t);
      else {
        // window.__STATE__ = {...};  /  var product = {...};
        const m = t.match(/=\s*(\{[\s\S]*\})\s*;?\s*$/);
        if (m) blobs.push(m[1]);
      }
    });

    const slug = normalizeSlug(u);
    const toks = urlTokens(u);
    const urlColors = colorKeys(colorFromUrl(u.href) || '');
    let best = null;
    let named = null;
    for (const b of blobs) {
      let data = b;
      if (typeof b === 'string') {
        try {
          data = JSON.parse(b);
        } catch {
          continue;
        }
      }
      walkJson(data, (o) => {
        const title = typeof o.name === 'string' ? o.name : typeof o.title === 'string' ? o.title : null;
        if (!title || title.length < 3) return;
        // hat das Produkt Varianten, zählt die zum Link passende (nicht der "ab"-Preis)
        const variant = Array.isArray(o.variants) && o.variants.length ? pickBest(o.variants, variantText, u) : null;
        const price = (variant && jsonPrice(variant)) ?? jsonPrice(o);
        if (price == null) return;
        const image = jsonImage(variant || {}) || jsonImage(o);
        // passt der Name (inkl. Größe/Farbe) zum Link? Dann ist es sehr wahrscheinlich das richtige Produkt
        const overlap = slugOverlap(slug, title);
        const own = `${title} ${variantText(o)}`;
        const score =
          overlap * 3 + matchScore(own, toks, urlColors) + sizeConflict(own, toks) + (image ? 1 : 0) + (variant ? 1 : 0);
        if (!best || score > best.score)
          best = { score, overlap, title, price, image, brand: jsonBrand(o), currency: jsonCurrency(variant || {}) || jsonCurrency(o) };
        // Produktname + Bild vom Eintrag, der am besten zum Link-Namen passt (nicht vom Varianten-Eintrag)
        const nameScore = overlap * 3 + (image ? 1 : 0) + (variant ? 1 : 0);
        if (!named || nameScore > named.nameScore) named = { nameScore, overlap, title, image };
      });
    }
    if (!best || best.score < 0) return {};
    return strip({
      // Name nur übernehmen, wenn er zum Link passt (sonst ist es evtl. nur ein Variantenname)
      title: named && named.overlap >= 0.3 ? named.title : null,
      price: best.price,
      currency: best.currency,
      image: best.image || named?.image,
      brand: best.brand,
    });
  }

  function variantText(v) {
    if (!v || typeof v !== 'object') return '';
    const opts = Array.isArray(v.options) ? v.options.map((x) => (typeof x === 'object' ? x.value || x.name : x)) : [];
    return [v.title, v.name, v.sku, v.id, v.productId, v.size, v.color, v.option1, v.option2, v.option3, ...opts]
      .filter((x) => typeof x === 'string' || typeof x === 'number')
      .join(' ');
  }

  // Kandidat nennt eine andere Größe als der Link (z.B. 1200x600 statt 900x400) -> Abzug
  function sizeConflict(candidate, toks) {
    const sizes = (normSize(candidate).match(/\d+x\d+(?:x\d+)?(?:mm)?/g) || []);
    const want = toks.filter((t) => /\d+x\d+/.test(t));
    if (!sizes.length || !want.length) return 0;
    return sizes.some((sz) => want.some((w) => w.startsWith(sz) || sz.startsWith(w))) ? 0 : -6;
  }

  function walkJson(root, visit) {
    let seen = 0;
    const stack = [[root, 0]];
    while (stack.length && seen < 20000) {
      const [n, depth] = stack.pop();
      if (!n || typeof n !== 'object' || depth > 14) continue;
      seen++;
      if (!Array.isArray(n)) visit(n);
      for (const v of Object.values(n)) if (v && typeof v === 'object') stack.push([v, depth + 1]);
    }
  }

  function jsonPrice(o) {
    const keys = ['price', 'salePrice', 'sale_price', 'finalPrice', 'currentPrice', 'priceGross', 'unitPrice', 'amount'];
    for (const k of keys) {
      const v = o[k];
      if (v == null) continue;
      if (typeof v === 'object') {
        const inner = v.amount ?? v.value ?? v.gross ?? v.formatted ?? v.raw;
        const p = parsePrice(inner);
        if (p) return p;
      } else {
        const p = parsePrice(v);
        if (p) return p;
      }
    }
    for (const k of ['priceCents', 'price_cents', 'priceInCents']) if (Number.isFinite(o[k])) return o[k] / 100;
    const variant = Array.isArray(o.variants) ? o.variants[0] : null;
    return variant && variant !== o ? jsonPrice(variant) : null;
  }

  function jsonCurrency(o) {
    const pr = o.price && typeof o.price === 'object' ? o.price : {};
    return (
      currencyOf(o.currency || o.currencyCode || o.currency_code || o.priceCurrency) ||
      currencyOf(pr.currency || pr.currencyCode || pr.currency_code || pr.formatted) ||
      currencyOf(typeof o.price === 'string' ? o.price : null)
    );
  }

  function jsonImage(o) {
    const pick = (v) => {
      if (!v) return null;
      if (typeof v === 'string') return /\.(jpe?g|png|webp|avif|gif)|\/image|cdn/i.test(v) ? v : null;
      if (Array.isArray(v)) return pick(v[0]);
      if (typeof v === 'object') return pick(v.src || v.url || v.originalSrc || v.large || v.full || v.path || v.image);
      return null;
    };
    return (
      pick(o.image) || pick(o.images) || pick(o.featuredImage) || pick(o.featured_image) || pick(o.media) ||
      pick(o.thumbnail) || pick(o.cover) || pick(o.picture) || null
    );
  }

  function jsonBrand(o) {
    const b = o.brand || o.vendor || o.manufacturer;
    return typeof b === 'string' ? b : b?.name || null;
  }

  function normalizeSlug(u) {
    const last = decodeURIComponent(u.pathname.split('/').filter(Boolean).pop() || '');
    return tokensOf(last.replace(/\.(html?|php)$/i, ''));
  }
  function tokensOf(s) {
    return String(s).toLowerCase().split(/[^a-z0-9äöüß]+/).filter((t) => t.length > 1);
  }
  function slugOverlap(slug, title) {
    if (!slug.length) return 0;
    const t = new Set(tokensOf(title));
    return slug.filter((x) => t.has(x)).length / slug.length;
  }

  // WooCommerce: Varianten stehen als JSON im Formular (data-product_variations)
  function fromWooVariations(doc, u) {
    const form = doc.querySelector('[data-product_variations]');
    if (!form) return {};
    let vars;
    try {
      vars = JSON.parse(form.getAttribute('data-product_variations'));
    } catch {
      return {};
    }
    if (!Array.isArray(vars) || !vars.length) return {};
    const want = [...u.searchParams.entries()].filter(([k]) => k.startsWith('attribute_'));
    const norm = (x) => normalizeWord(x);
    let v = null;
    if (want.length) {
      v = vars.find((x) => want.every(([k, val]) => !x.attributes?.[k] || norm(x.attributes[k]) === norm(val)));
    }
    v = v || pickBest(vars, (x) => Object.values(x.attributes || {}).join(' '), u);
    if (!v) return {};
    return strip({
      price: parsePrice(v.display_price),
      image: v.image?.full_src || v.image?.src || v.image?.url,
    });
  }
  function normalizeWord(x) {
    return String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ß/g, 'ss').replace(/[^a-z0-9]/g, '');
  }

  /* ---- Genau die Variante aus dem Link finden (Farbe, Größe, …) ---- */

  const normSize = (s) =>
    String(s || '')
      .toLowerCase()
      .replace(/(\d)\s*[x×*]\s*(?=\d)/g, '$1x')
      .replace(/(\d)\s*mm\b/g, '$1mm');
  const GENERIC = new Set(['products', 'product', 'produkt', 'artikel', 'detail', 'item', 'shop', 'de', 'en', 'at', 'html', 'img', 'variant']);

  function urlTokens(u) {
    const raw = decodeURIComponent(`${u.pathname} ${[...u.searchParams.values()].join(' ')}`);
    return tokensOf(normSize(raw).replace(/[-_/+=&.]/g, ' ')).filter((t) => !GENERIC.has(t) && !/^\d{1,2}$/.test(t));
  }

  // Wie gut passt ein Kandidat (Variantenname, SKU …) zum Link?
  function matchScore(candidate, toks, urlColors) {
    const c = normSize(candidate);
    const words = new Set(tokensOf(c));
    let score = 0;
    const compact = normalizeWord(candidate);
    for (const t of toks) {
      if (words.has(t)) score += /\d/.test(t) ? 2 : 1;
      // "streamdeck" im Link = "Stream Deck" im Namen
      else if (t.length >= 4 && compact.includes(normalizeWord(t))) score += /\d/.test(t) ? 2 : 1;
      // Größen: "900x400x3mm" im Link passt zu "900x400" in der Variante
      else if (/\d/.test(t) && [...words].some((w) => /\d.*x.*\d/.test(w) && (t.startsWith(w) || w.startsWith(t)))) score += 2;
    }
    const cc = colorKeys(candidate);
    if (urlColors.size && cc.size) score += [...cc].some((x) => urlColors.has(x)) ? 3 : -5; // falsche Farbe = raus
    return score;
  }

  function pickBest(list, textOf, u) {
    const toks = urlTokens(u);
    const urlColors = colorKeys(colorFromUrl(u.href) || '');
    let best = null;
    let bestScore = 0;
    const scores = list.map((x) => matchScore(textOf(x), toks, urlColors));
    scores.forEach((sc, i) => {
      if (sc > bestScore) {
        best = list[i];
        bestScore = sc;
      }
    });
    // alle gleich gut -> der Link sagt nichts über die Variante aus
    if (scores.every((sc) => sc === bestScore)) return null;
    return best;
  }

  // Name aus dem Link, z.B. /products/RXD-Mauspad-Black-900x400x3mm -> "RXD Mauspad Black 900x400x3mm"
  function titleFromUrl(u) {
    const last = decodeURIComponent(u.pathname.split('/').filter(Boolean).pop() || '');
    const t = last.replace(/\.(html?|php)$/i, '').replace(/[-_+]+/g, ' ').trim();
    return t.length > 2 && !/^\d+$/.test(t) ? t : null;
  }

  // Beträge in Werbetexten: "Kostenloser Versand ab 90 €", "Spare 10 €", "ab 3 Stück" …
  const PROMO =
    /versand|shipping|lieferung|delivery|gratis|kostenlos|spare|sparen|\bsave\b|rabatt|discount|gutschein|coupon|mindest|bestellwert|warenkorb|ratenzahlung|monatlich|per month|\bab\s*$|\bfrom\s*$|über\s*$|over\s*$|bis zu|up to/i;

  // Alte / durchgestrichene Preise (UVP, "statt", compare-at) erkennen
  const OLD_PRICE =
    /\bold|old-|-old|compare|\bwas\b|was-price|uvp|strike|rrp|msrp|crossed|statt|former|previous/i;
  function isOldPrice(el) {
    for (let n = el; n && n.nodeType === 1 && n.tagName !== 'BODY'; n = n.parentElement) {
      if (/^(DEL|S|STRIKE)$/.test(n.tagName)) return true;
      if (OLD_PRICE.test(`${n.className || ''} ${n.id || ''}`)) return true;
    }
    return false;
  }
  function removeOldPrices(root) {
    root.querySelectorAll('del, s, strike').forEach((n) => n.remove());
    root.querySelectorAll('[class], [id]').forEach((n) => {
      if (n.isConnected && OLD_PRICE.test(`${n.className || ''} ${n.id || ''}`) && /\d/.test(n.textContent) && n.textContent.length < 80) n.remove();
    });
  }
  // mehrere Beträge in einem Preisfeld ("49,99 € 39,99 €") -> der kleinste ist der aktuelle
  // Grundpreis ("3,99 € / 1 l", "je 100 g") oder Menge ("/ 1 l") statt Produktpreis?
  function isUnitPrice(v, at, len) {
    const after = v.slice(at + len, at + len + 14);
    const before = v.slice(Math.max(0, at - 4), at);
    return /^\s*(?:[€$£]|eur|usd|chf)?\s*(?:\/|pro\b|je\b|per\b)/i.test(after) || /\/\s*$/.test(before);
  }

  function lowestAmount(v) {
    const all = [...v.matchAll(/\d{1,3}(?:[.,\s]\d{3})*(?:[.,](?:\d{1,2}|[-–]))?/g)]
      .filter((m) => !/^\s*%/.test(v.slice(m.index + m[0].length))) // "25 %" ist kein Preis
      .filter((m) => !isUnitPrice(v, m.index, m[0].length))
      .map((m) => {
        const after = v.slice(m.index + m[0].length, m.index + m[0].length + 5);
        const before = v.slice(Math.max(0, m.index - 5), m.index);
        return { value: parsePrice(m[0].replace(/\s/g, '')), withCur: /^\s?([€$£]|eur|usd|chf)/i.test(after) || /([€$£]|eur|usd|chf)\s?$/i.test(before) };
      })
      .filter((x) => x.value);
    const cur = all.filter((x) => x.withCur);
    const nums = (cur.length ? cur : all).map((x) => x.value);
    return nums.length ? Math.min(...nums) : null;
  }

  // Letzter Ausweg: sichtbare Seite lesen (Überschrift, Preis-Elemente, großes Bild)
  function fromDom(doc) {
    const h1 = text(doc.querySelector('h1'));
    let price = null;
    let currency = null;
    const exact = [...doc.querySelectorAll('[data-price-amount], [itemprop=price][content], [class*="price" i][content]')];
    const loose = [...doc.querySelectorAll('[data-price], .price, .product-price, .product__price, [class*="price" i], [id*="price" i]')];
    for (const el of [...exact, ...loose]) {
      if (isOldPrice(el)) continue;
      if (/old|regular|rrp|list/i.test(el.getAttribute('data-price-type') || '')) continue;
      const machine = el.getAttribute('data-price-amount');
      if (machine && parsePrice(machine)) {
        price = parsePrice(machine);
        currency = currencyOf(text(el));
        break;
      }
      let v = el.getAttribute('content') || el.getAttribute('data-price');
      if (!v) {
        const copy = el.cloneNode(true);
        removeOldPrices(copy);
        v = text(copy);
      }
      v = v.slice(0, 200);
      // nur Text VOR dem Betrag prüfen ("Versand ab 90 €"), nicht "39,90 € zzgl. Versand"
      if (PROMO.test(v.slice(0, v.search(/\d/)))) continue;
      if (/\d/.test(v) && /[€$£]|eur|usd|chf|\d[.,]\d{2}/i.test(v)) {
        price = lowestAmount(v);
        currency = currencyOf(v);
        if (price) break;
      }
    }
    let image = null;
    for (const img of doc.querySelectorAll('main img, [class*="product" i] img, img')) {
      const src = img.getAttribute('src') || img.getAttribute('data-src') || (img.getAttribute('srcset') || '').split(' ')[0];
      if (src && !/logo|icon|sprite|payment|flag|avatar|\.svg/i.test(src) && !src.startsWith('data:')) {
        image = src;
        break;
      }
    }
    return strip({ title: h1, price, currency, image });
  }

  // Preis irgendwo als JSON im HTML, z.B. "price":"39.90" (auch in kaputtem/verschachteltem JavaScript)
  function fromJsonRegex(html, u) {
    const re = /"(?:price|salePrice|sale_price|finalPrice|currentPrice|price_amount|priceAmount)"\s*:\s*"?(\d{1,6}(?:[.,]\d{1,2})?)"?/g;
    const toks = urlTokens(u);
    const urlColors = colorKeys(colorFromUrl(u.href) || '');
    let best = null;
    for (const m of html.matchAll(re)) {
      const price = parsePrice(m[1]);
      if (!price) continue;
      // Umgebung prüfen: steht dort der Name/die Größe/Farbe aus dem Link?
      // eigenes JSON-Objekt ({ … "price": … }) zählt doppelt, weitere Umgebung einfach
      const objStart = html.lastIndexOf('{', m.index);
      const objEnd = html.indexOf('}', m.index);
      const obj = html.slice(Math.max(objStart, m.index - 800), objEnd < 0 ? m.index + 200 : Math.min(objEnd, m.index + 800));
      const around = html.slice(Math.max(0, m.index - 150), m.index + 150);
      const clean = (x) => x.replace(/["{}:,]/g, ' ');
      const score =
        2 * (matchScore(clean(obj), toks, urlColors) + sizeConflict(obj, toks)) +
        matchScore(clean(around), toks, urlColors);
      if (!best || score > best.score) {
        const cur = around.match(/"(?:priceCurrency|currency|currencyCode|currency_code)"\s*:\s*"([A-Z]{3})"/);
        best = { score, price, currency: cur ? cur[1] : null };
      }
    }
    return best && best.score > 0 ? strip({ price: best.price, currency: best.currency }) : {};
  }

  // Sichtbarer Text: erster Betrag mit Währungszeichen (bevorzugt nach der Überschrift)
  function fromText(doc) {
    const body = doc.body?.cloneNode(true);
    if (!body) return {};
    body.querySelectorAll('script, style, noscript, header, nav, footer').forEach((n) => n.remove());
    removeOldPrices(body);
    // Block-Elemente mit " | " trennen, damit Sätze nicht zusammenkleben
    body.querySelectorAll('p, div, li, h1, h2, h3, h4, span, br, td').forEach((n) => n.append(' | '));
    const t = body.textContent.replace(/\s+/g, ' ');
    const num = '\\d{1,3}(?:[.,\\s]\\d{3})*(?:[.,](?:\\d{2}|[-–]))?';
    const sym = '€|EUR|US\\$|USD|\\$|£|GBP|CHF';
    const re = new RegExp(`(?:(${sym})\\s?(${num}))|(?:(${num})\\s?(${sym}))`, 'g');
    const h1 = text(doc.querySelector('h1'));
    const start = h1 ? Math.max(0, t.indexOf(h1)) : 0;
    const hits = [...t.matchAll(re)]
      .filter((m) => {
        // nur der eigene Satz vor dem Betrag zählt ("Versand ab 90 €")
        const before = t.slice(Math.max(0, m.index - 45), m.index);
        return !PROMO.test(before.split(/[|!?•]|\.\s/).pop()) && !isUnitPrice(t, m.index, m[0].length);
      })
      .map((m) => ({
      at: m.index,
      price: parsePrice((m[2] || m[3] || '').replace(/\s/g, '')),
      currency: currencyOf(m[1] || m[4]),
    }));
    const hit = hits.find((h) => h.price && h.at >= start) || hits.find((h) => h.price);
    if (!hit) return {};
    // direkt daneben stehende Beträge (alter + neuer Preis) -> den kleineren nehmen
    const near = hits.filter((h) => h.price && h.at >= hit.at && h.at - hit.at < 60 && h.currency === hit.currency);
    return { price: Math.min(...near.map((h) => h.price)), currency: hit.currency };
  }

  /* ---- Währung ---- */

  function currencyOf(v) {
    if (!v) return null;
    const s = String(v);
    if (/€|\bEUR\b|euro/i.test(s)) return 'EUR';
    if (/£|\bGBP\b/i.test(s)) return 'GBP';
    if (/\bCHF\b/i.test(s)) return 'CHF';
    if (/C\$|CA\$|\bCAD\b/.test(s)) return 'CAD';
    if (/A\$|AU\$|\bAUD\b/.test(s)) return 'AUD';
    if (/zł|\bPLN\b/i.test(s)) return 'PLN';
    if (/¥|円|\bJPY\b/.test(s)) return 'JPY';
    if (/\$|\bUSD\b/i.test(s)) return 'USD';
    const code = s.trim().toUpperCase();
    return /^[A-Z]{3}$/.test(code) ? code : null;
  }

  // Währung, in der Shopify die Preise ausliefert (/products/….js hat keine Angabe)
  function shopifyCurrency(html, doc) {
    const m = html.match(/Shopify\.currency\s*=\s*\{[^}]*"active"\s*:\s*"([A-Z]{3})"/);
    return (m && m[1]) || currencyOf(meta(doc, 'og:price:currency') || meta(doc, 'product:price:currency')) || null;
  }

  // Keine Währung angegeben: nach Zeichen auf der Seite / Shopify-Einstellung raten
  function guessCurrency(html, doc) {
    const shopify = html.match(/Shopify\.currency\s*=\s*\{[^}]*"active"\s*:\s*"([A-Z]{3})"/);
    if (shopify) return shopify[1];
    const iso = html.match(/"(?:priceCurrency|currencyCode|currency)"\s*:\s*"([A-Z]{3})"/);
    if (iso) return iso[1];
    // nur sichtbaren Text zählen, "$" aus JavaScript-Code ignorieren
    const body = doc.body?.cloneNode(true);
    body?.querySelectorAll('script, style, noscript').forEach((n) => n.remove());
    const t = body?.textContent || '';
    const eur = (t.match(/€|\bEUR\b/g) || []).length;
    const usd = (t.match(/(?:^|[\s(])\$\s?\d|\bUSD\b/g) || []).length;
    return usd > eur ? 'USD' : 'EUR';
  }

  const RATES_KEY = 'wunschliste.rates';
  // Notfall-Kurse (1 EUR = x), falls kein Kursdienst erreichbar ist
  const FALLBACK_RATES = { USD: 1.16, GBP: 0.87, CHF: 0.94, CAD: 1.6, AUD: 1.77, PLN: 4.27, JPY: 172 };
  let ratesPromise = null;

  function getRates() {
    if (ratesPromise) return ratesPromise;
    ratesPromise = (async () => {
      let cached = null;
      try {
        cached = JSON.parse(localStorage.getItem(RATES_KEY));
      } catch {}
      if (cached && Date.now() - cached.at < 12 * 3600e3) return cached;
      const sources = [
        'https://api.frankfurter.dev/v1/latest?base=EUR',
        'https://api.frankfurter.app/latest?from=EUR',
        'https://open.er-api.com/v6/latest/EUR',
      ];
      for (const src of sources) {
        try {
          const res = await fetch(src, { signal: AbortSignal.timeout(8000) });
          const data = await res.json();
          if (data?.rates?.USD) {
            const fresh = { at: Date.now(), rates: data.rates, approx: false };
            try {
              localStorage.setItem(RATES_KEY, JSON.stringify(fresh));
            } catch {}
            return fresh;
          }
        } catch {}
      }
      ratesPromise = null; // beim nächsten Mal wieder versuchen
      return cached ? { ...cached, approx: true } : { at: Date.now(), rates: FALLBACK_RATES, approx: true };
    })();
    return ratesPromise;
  }

  async function toEur(price, currency) {
    if (price == null || !currency || currency === 'EUR') return { eur: price, approx: false };
    const { rates, approx } = await getRates();
    const r = rates[currency];
    if (!r) return { eur: null, approx: false, unknown: true };
    return { eur: Math.round((price / r) * 100) / 100, approx };
  }

  async function extractShopify(u) {
    const handle = u.pathname.match(/\/products\/([^/?#]+)/)[1];
    const prefix = u.pathname.slice(0, u.pathname.indexOf('/products/'));
    const p = JSON.parse(await fetchText(`${u.origin}${prefix}/products/${handle}.js`));
    const vid = u.searchParams.get('variant');
    const v =
      (vid && p.variants.find((x) => String(x.id) === vid)) ||
      pickBest(p.variants, (x) => [x.title, x.option1, x.option2, x.option3].filter(Boolean).join(' '), u) ||
      p.variants.find((x) => x.available) ||
      p.variants[0];
    const opts = (p.options || []).map((o) => (typeof o === 'string' ? o : o.name));
    const idx = opts.findIndex((n) => COLOR_OPTION.test(n));
    const color = idx >= 0 ? v[`option${idx + 1}`] : v.title !== 'Default Title' ? v.title : null;
    const img = v.featured_image?.src || p.featured_image || (p.images || [])[0];
    return {
      title: v.title && v.title !== 'Default Title' ? `${p.title} ${v.title}` : p.title,
      brand: p.vendor,
      color,
      image: img && img.startsWith('//') ? `https:${img}` : img,
      price: v.price != null ? v.price / 100 : null,
      gtin: v.barcode || null,
    };
  }

  function amazonPrice(doc) {
    return text(doc.querySelector('#corePrice_feature_div .a-offscreen') || doc.querySelector('.a-price .a-offscreen'));
  }

  function extractAmazon(doc) {
    const img = doc.querySelector('#landingImage');
    let dyn = null;
    try {
      dyn = Object.keys(JSON.parse(img?.getAttribute('data-a-dynamic-image')))[0];
    } catch {}
    return {
      title: text(doc.querySelector('#productTitle')),
      brand: text(doc.querySelector('#bylineInfo')).replace(/^(Marke|Besuche den|Visit the)\s*:?\s*/i, '').replace(/-?Store$/i, ''),
      color: text(doc.querySelector('#variation_color_name .selection')) || null,
      image: img?.getAttribute('data-old-hires') || dyn || img?.getAttribute('src'),
      price: parsePrice(amazonPrice(doc)),
      currency: currencyOf(amazonPrice(doc)),
    };
  }

  function jsonLd(doc) {
    const out = [];
    const walk = (n) => {
      if (!n || typeof n !== 'object') return;
      if (Array.isArray(n)) return n.forEach(walk);
      out.push(n);
      if (n['@graph']) walk(n['@graph']);
      if (n.hasVariant) walk(n.hasVariant);
    };
    doc.querySelectorAll('script[type="application/ld+json"]').forEach((s) => {
      try {
        walk(JSON.parse(s.textContent));
      } catch {}
    });
    return out;
  }

  // Produktname laut Seite (Überschrift / Titel), um das Hauptprodukt zu erkennen
  function pageName(doc) {
    return `${text(doc.querySelector('h1'))} ${meta(doc, 'og:title') || ''} ${text(doc.querySelector('title'))}`;
  }

  function fromJsonLd(doc, u) {
    const products = jsonLd(doc).filter((n) => [].concat(n['@type'] || []).includes('Product'));
    if (!products.length) return {};
    const params = [...u.searchParams.values()];
    const bySku = (x) => x.sku && (params.includes(String(x.sku)) || u.pathname.includes(String(x.sku)));
    const p =
      products.find(bySku) ||
      (products.length > 1 &&
        pickBest(products, (x) => [x.name, x.color, x.size, x.sku, x.url].filter(Boolean).join(' '), u)) ||
      (products.length > 1 &&
        products.find((x) => x.name && normalizeWord(pageName(doc)).includes(normalizeWord(x.name)))) ||
      products[0];
    const offerPrice = (x) => parsePrice(x.price ?? x.lowPrice ?? [].concat(x.priceSpecification || [])[0]?.price);
    const offers = [].concat(p.offers || []).flatMap((o) => (o.offers ? [].concat(o.offers) : [o])).filter(offerPrice);
    // mehrere Angebote (z.B. Größen): das zum Link passende nehmen
    const vid = u.searchParams.get('variant');
    const o =
      (vid && offers.find((x) => String(x.url || '').includes(vid))) ||
      offers.find(bySku) ||
      (offers.length > 1 && pickBest(offers, (x) => [x.name, x.sku, x.url].filter(Boolean).join(' '), u)) ||
      offers[0] ||
      {};
    const spec = [].concat(o.priceSpecification || [])[0] || {};
    let img = p.image;
    if (Array.isArray(img)) img = img[0];
    if (img && typeof img === 'object') img = img.contentUrl || img.url;
    return strip({
      title: p.name,
      brand: typeof p.brand === 'object' ? p.brand?.name : p.brand,
      color: p.color,
      image: img,
      price: parsePrice(o.price ?? o.lowPrice ?? spec.price),
      currency: currencyOf(o.priceCurrency || spec.priceCurrency),
      gtin: p.gtin13 || p.gtin || p.gtin12 || p.gtin14 || p.gtin8,
      mpn: p.mpn,
    });
  }


  /* ------------------------------------------------------------ Liste */

  async function resolve(url) {
    const p = await extractProduct(url);
    const { eur, approx, unknown } = await toEur(p.price, p.currency);
    return {
      url: p.url,
      title: p.title,
      image: p.image,
      price: eur, // immer in Euro
      originalPrice: p.price,
      currency: p.currency,
      priceSource: p.priceSource,
      rateApprox: approx,
      shop: p.shop,
      checkedAt: new Date().toISOString(),
      error: p.price == null ? 'kein preis gefunden' : unknown ? `unbekannte währung ${p.currency}` : null,
    };
  }

  const all = (lid = activeId) => load(lid);

  async function add(url) {
    if (!/^https?:\/\//i.test(url || '')) throw new Error('gültiger link (http/https) benötigt');
    const lid = activeId;
    const found = await resolve(url.trim());
    const item = { id: Math.random().toString(36).slice(2, 10), ...found, detectedPrice: found.price, sourceUrl: url.trim() };
    const items = load(lid);
    items.push(item);
    save(items, lid);
    return item;
  }

  async function refresh(id, lid = activeId) {
    const item = load(lid).find((i) => i.id === id);
    if (!item) throw new Error('nicht gefunden');
    let patch;
    try {
      patch = await resolve(item.sourceUrl || item.url);
      // erkannten Shop-Preis immer merken (zum Vergleich, falls der Preis manuell gesetzt ist)
      patch.detectedPrice = patch.price ?? item.detectedPrice ?? null;
      if (patch.price != null && isReliable(patch.priceSource)) {
        patch.manualPrice = null; // Shop liefert sicher einen Preis -> der gilt
      } else if (item.manualPrice != null) {
        // kein oder nur geratener Preis: selbst eingetragener Preis gilt
        patch.price = item.manualPrice;
        patch.error = null;
      } else if (patch.price == null) patch.price = item.price; // bekannten Preis behalten
      if (!patch.image) patch.image = item.image;
    } catch (e) {
      patch = { error: e.message, checkedAt: new Date().toISOString() };
    }
    const items = load(lid);
    const cur = items.find((i) => i.id === id);
    if (!cur) throw new Error('nicht gefunden');
    Object.assign(cur, patch);
    save(items, lid);
    return cur;
  }

  // gleiches Produkt schon in der Liste?
  const hasUrl = (url, lid = activeId) =>
    load(lid).some((i) => [i.sourceUrl, i.url].some((u) => u && u.replace(/[#?].*$/, '') === url.replace(/[#?].*$/, '') && (u.split('?')[1] || '') === (url.split('?')[1] || '')));

  // eur = Zahl: Preis selbst festlegen · eur = null: wieder den erkannten Shop-Preis nehmen
  function setPrice(id, eur) {
    const items = load();
    const cur = items.find((i) => i.id === id);
    if (!cur) throw new Error('nicht gefunden');
    if (eur == null) {
      Object.assign(cur, { manualPrice: null, price: cur.detectedPrice ?? null });
      if (cur.price == null) cur.error = 'kein preis gefunden';
    } else {
      if (cur.manualPrice == null && cur.detectedPrice === undefined) cur.detectedPrice = cur.price ?? null;
      Object.assign(cur, { price: eur, manualPrice: eur, error: null });
    }
    save(items);
    return cur;
  }

  function remove(id) {
    save(load().filter((i) => i.id !== id));
  }

  // inspect: Produkt nur auslesen, ohne es zu speichern (für test.html)
  window.Wishlist = {
    all,
    hasUrl,
    add,
    refresh,
    remove,
    setPrice,
    isReliable,
    inspect: resolve,
    account: {
      detect,
      pull,
      signIn,
      signOut,
      user: () => session?.user || null,
      isOnline: () => online,
      onSessionLost: (fn) => (onSessionLost = fn),
    },
    lists: getLists,
    active: getActive,
    switchTo,
    createList,
    renameList,
    deleteList,
  };
})();

'use strict';

const $ = (s, el = document) => el.querySelector(s);
const eur = (n) => (n == null ? '—' : new Intl.NumberFormat('de-AT', { style: 'currency', currency: 'EUR' }).format(n));
const pad = (n) => String(n).padStart(2, '0');
const W = window.Wishlist;

let items = []; // Produkte der offenen Liste
const busy = new Set(); // Produkte, deren Preis gerade geladen wird
let run = 0; // steigt bei An-/Abmelden: laufende Aktualisierungen der alten Sitzung zeichnen dann nicht mehr
let refreshing = null; // laufende Aktualisierung (nur eine gleichzeitig)
const cards = new Map(); // fertige Karten je Produkt, damit Bilder beim Neuzeichnen nicht flackern

function renderLists() {
  const box = $('#lists');
  box.replaceChildren();
  const active = W.active();
  for (const l of W.lists()) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn lists__tab';
    b.setAttribute('aria-current', String(l.id === active.id));
    b.textContent = l.name;
    const n = document.createElement('small');
    n.textContent = l.count;
    b.append(n);
    b.onclick = () => l.id !== active.id && openList(l.id);
    box.append(b);
  }
  $('#total-name').textContent = active.name.toUpperCase();
  $('#list-title').textContent = active.name.toUpperCase();
  $('#delete-list').hidden = W.lists().length <= 1;
}

// Liste wechseln: nur anzeigen, NICHT neu laden (Preise werden beim Öffnen der Seite aktualisiert)
function openList(id) {
  W.switchTo(id);
  items = W.all();
  renderLists();
  render();
  if (!refreshing) status(items.length ? '' : `liste "${W.active().name}" ist leer. füg oben einen produktlink ein.`);
}

/* ---- eigenes Fenster (ersetzt prompt/confirm des Browsers) ---- */

let modalDone = null;
// ask({ title, text, input?: { value, placeholder, mode }, hint, ok, danger }) -> Text (Eingabe) / true (Bestätigung) / null (abgebrochen)
function ask({ title = 'wishly', text = '', input = null, hint = '', ok = 'ok', danger = false, cancel = true }) {
  if (modalDone) modalDone(null);
  const modal = $('#modal');
  $('#modal-title').textContent = title;
  $('#modal-text').textContent = text;
  $('#modal-hint').textContent = hint;
  $('#modal-ok').textContent = ok.toUpperCase();
  $('#modal-ok').className = `btn ${danger ? 'btn--red' : 'btn--green'}`;
  $('#modal-cancel').hidden = !cancel; // reine Hinweise brauchen kein "Abbrechen"
  modal.classList.toggle('modal--danger', danger);
  const field = $('#modal-field');
  const inp = $('#modal-input');
  field.hidden = !input;
  if (input) {
    inp.value = input.value || '';
    inp.placeholder = input.placeholder || '';
    inp.inputMode = input.mode || 'text';
  }
  modal.hidden = false;
  setTimeout(() => (input ? inp.select() : $('#modal-ok').focus()), 30);
  return new Promise((resolve) => {
    modalDone = (value) => {
      modalDone = null;
      modal.hidden = true;
      resolve(value);
    };
  });
}
$('#modal-form').addEventListener('submit', (e) => {
  e.preventDefault();
  if (modalDone) modalDone($('#modal-field').hidden ? true : $('#modal-input').value);
});
$('#modal-cancel').addEventListener('click', () => modalDone && modalDone(null));
$('#modal').addEventListener('click', (e) => e.target.id === 'modal' && modalDone && modalDone(null));
document.addEventListener('keydown', (e) => e.key === 'Escape' && modalDone && modalDone(null));

async function newList() {
  const name = await ask({ title: 'neue liste', text: 'name der neuen liste:', input: { placeholder: 'z.b. geburtstag' }, ok: 'erstellen' });
  if (name == null) return;
  try {
    const l = W.createList(name);
    openList(l.id);
    status(`liste "${l.name}" erstellt`, 'ok');
  } catch (e) {
    status(`fehler: ${e.message}`, 'err');
  }
}

async function renameList() {
  const cur = W.active();
  const name = await ask({ title: 'umbenennen', text: `neuer name für "${cur.name}":`, input: { value: cur.name }, ok: 'speichern' });
  if (name == null) return;
  try {
    W.renameList(cur.id, name);
    renderLists();
    status(`liste umbenannt in "${name.trim()}"`, 'ok');
  } catch (e) {
    status(`fehler: ${e.message}`, 'err');
  }
}

async function deleteList() {
  const cur = W.active();
  const n = W.all().length;
  const yes = await ask({
    title: 'liste löschen',
    text: `liste "${cur.name}"${n ? ` mit ${n} produkt${n === 1 ? '' : 'en'}` : ''} löschen?`,
    ok: 'löschen',
    danger: true,
  });
  if (!yes) return;
  try {
    W.deleteList(cur.id);
    openList(W.active().id);
    status(`liste "${cur.name}" gelöscht`);
  } catch (e) {
    status(`fehler: ${e.message}`, 'err');
  }
}

function status(text, state = '') {
  const el = $('#statusline');
  el.textContent = text;
  el.dataset.state = state;
}

// Felder, die auf der Karte sichtbar sind
const VISIBLE = ['title', 'image', 'price', 'priceSource', 'currency', 'originalPrice', 'rateApprox', 'manualPrice', 'error', 'shop', 'url', 'sourceUrl'];
const safeUrl = (u) => (/^https?:\/\//i.test(u || '') ? u : null);

function buildCard(item) {
  const el = $('#card').content.firstElementChild.cloneNode(true);
  const img = $('img', el);
  if (item.image) {
    img.src = item.image;
    img.alt = item.title;
    img.onerror = () => {
      img.parentElement.classList.add('noimg');
      img.remove();
    };
  } else {
    $('.card__img', el).classList.add('noimg');
    img.remove();
  }
  $('.card__title', el).textContent = item.title;
  const best = $('.card__best', el);
  best.textContent = eur(item.price);
  if (item.priceSource) {
    best.title = `preis aus: ${item.priceSource}`;
    best.onclick = () =>
      status(`${item.title}: preis aus ${item.priceSource}${item.currency && item.currency !== 'EUR' ? `, umgerechnet aus ${item.currency}` : ''}`);
  }
  const shopEl = $('.card__shop', el);
  shopEl.textContent = item.shop || '';
  if (item.currency && item.currency !== 'EUR' && item.originalPrice != null) {
    // Originalpreis in Fremdwährung anzeigen
    const orig = new Intl.NumberFormat('de-AT', { style: 'currency', currency: item.currency }).format(item.originalPrice);
    shopEl.textContent += ` · original ${orig}${item.rateApprox ? ' (kurs ca.)' : ''}`;
  }
  if (item.manualPrice == null && item.price != null && !W.isReliable(item.priceSource)) shopEl.textContent += ' · preis unsicher';
  if (item.manualPrice != null) shopEl.textContent += ' · preis selbst eingetragen';

  const err = $('.card__meta', el);
  if (item.error) err.textContent = item.error;
  else err.remove();

  // Bearbeiten nur, wenn der Preis nicht (sicher) herausgefunden wurde
  const setBtn = $('.card__set', el);
  if (item.price == null || item.manualPrice != null || !W.isReliable(item.priceSource)) {
    setBtn.onclick = () => enterPrice(item);
    if (item.manualPrice != null) setBtn.textContent = 'PREIS ÄNDERN';
    else if (item.price != null) setBtn.textContent = 'PREIS BEARBEITEN';
  } else setBtn.remove();

  const link = $('.card__src', el);
  const href = safeUrl(item.url) || safeUrl(item.sourceUrl);
  if (href) link.href = href;
  else link.remove();
  $('.card__rm', el).onclick = () => removeItem(item);
  return el;
}

function render() {
  // nach Preis sortieren: teuerstes zuerst, ohne Preis ans Ende
  const sorted = [...items].sort((a, b) => {
    if (a.price == null || b.price == null) return (a.price == null) - (b.price == null);
    return b.price - a.price;
  });
  const els = sorted.map((item, i) => {
    // Karte nur neu bauen, wenn sich etwas Sichtbares geändert hat (Bilder laden sonst neu und flackern)
    const sig = JSON.stringify(VISIBLE.map((k) => item[k]));
    let c = cards.get(item.id);
    if (!c || c.sig !== sig) {
      const el = buildCard(item);
      // gleiches Bild: vorhandenes (schon geladenes) Bild-Element übernehmen
      const oldImg = c && $('.card__img img', c.el);
      const newImg = $('.card__img img', el);
      if (oldImg && newImg && oldImg.getAttribute('src') === newImg.getAttribute('src')) newImg.replaceWith(oldImg);
      c = { sig, el };
      cards.set(item.id, c);
    }
    c.el.classList.toggle('loading', busy.has(item.id));
    $('.card__idx', c.el).textContent = pad(i + 1);
    return c.el;
  });
  const ids = new Set(items.map((i) => i.id));
  for (const id of cards.keys()) if (!ids.has(id)) cards.delete(id);
  $('#grid').replaceChildren(...els);

  $('#empty').hidden = items.length > 0;
  const tab = $('.lists__tab[aria-current="true"] small');
  if (tab) tab.textContent = items.length;
  const priced = items.filter((i) => i.price != null);
  $('#count').textContent = items.length;
  $('#sum').textContent = eur(priced.length ? priced.reduce((s, i) => s + i.price, 0) : null);
}

let adding = false;
async function addItem(url) {
  if (adding) return;
  if (W.hasUrl(url)) return status('dieses produkt ist schon in der liste', 'err');
  adding = true;
  const btn = $('#add-btn');
  btn.disabled = true;
  status('lade produkt …', 'busy');
  try {
    const lid = W.active().id;
    const listName = W.active().name;
    const myRun = run;
    const item = await W.add(url);
    if (myRun !== run) return;
    if (W.active().id !== lid) {
      // inzwischen andere Liste offen: Produkt liegt trotzdem in der ursprünglichen Liste
      renderLists();
      status(`hinzugefügt zu "${listName}": ${item.title}`, 'ok');
      return;
    }
    items.push(item);
    renderLists();
    render();
    const conv = item.currency && item.currency !== 'EUR' ? ` (umgerechnet aus ${item.currency})` : '';
    status(`hinzugefügt: ${item.title} → ${eur(item.price)}${conv}`, item.price == null ? 'err' : 'ok');
    $('#url').value = '';
  } catch (e) {
    status(`fehler: ${e.message}`, 'err');
  } finally {
    adding = false;
    btn.disabled = false;
  }
}

// Preise neu laden. allLists = true: alle Listen (beim Öffnen der Seite), sonst nur die offene Liste (Knopf)
function refreshAll(allLists = false) {
  if (refreshing) return refreshing;
  const myRun = run;
  const ids = allLists ? W.lists().map((l) => l.id) : [W.active().id];
  const queue = ids.flatMap((lid) => W.all(lid).map((item) => ({ lid, id: item.id })));
  if (!queue.length) return Promise.resolve();
  const btn = $('#refresh');
  btn.disabled = true;
  const total = queue.length;
  let done = 0;
  status(`aktualisiere preise … 0/${total}`, 'busy');
  queue.forEach((q) => busy.add(q.id));
  render();

  const worker = async () => {
    while (queue.length && myRun === run) {
      const { lid, id } = queue.shift();
      let fresh = null;
      try {
        fresh = await W.refresh(id, lid);
      } catch {
        /* Fehler steht am Produkt */
      }
      if (myRun !== run) return;
      busy.delete(id);
      // nur zeichnen, wenn das Produkt in der gerade offenen Liste ist
      if (lid === W.active().id) {
        const idx = items.findIndex((x) => x.id === id);
        if (idx >= 0 && fresh) items[idx] = fresh;
        render();
      }
      status(`aktualisiere preise … ${++done}/${total}`, 'busy');
    }
  };
  refreshing = Promise.all(Array.from({ length: Math.min(4, total) }, worker)).then(() => {
    refreshing = null;
    if (myRun !== run) return;
    btn.disabled = false;
    items = W.all();
    render();
    status(`preise aktuell · ${new Date().toLocaleTimeString('de-AT', { timeStyle: 'short' })}`, 'ok');
  });
  return refreshing;
}

async function enterPrice(item) {
  const input = await ask({
    title: 'preis',
    text: `preis in euro für "${item.title}":`,
    input: { value: item.price != null ? item.price.toFixed(2).replace('.', ',') : '', placeholder: 'z.b. 34,90', mode: 'decimal' },
    hint: item.manualPrice != null ? 'leer lassen = eintrag löschen' : '',
    ok: 'speichern',
  });
  if (input == null) return;
  if (!input.trim()) {
    if (item.manualPrice == null) return;
    const fresh = W.setPrice(item.id, null);
    items[items.findIndex((x) => x.id === item.id)] = fresh;
    render();
    return status(`${item.title}: eingetragener preis gelöscht`, 'ok');
  }
  const value = parseFloat(input.replace(/[^\d,.-]/g, '').replace(/\.(?=\d{3})/g, '').replace(',', '.'));
  if (!Number.isFinite(value) || value <= 0) return status('ungültiger preis', 'err');
  const fresh = W.setPrice(item.id, Math.round(value * 100) / 100);
  items[items.findIndex((x) => x.id === item.id)] = fresh;
  render();
  status(`preis gesetzt: ${item.title} → ${eur(fresh.price)}`, 'ok');
}

async function removeItem(item) {
  if (!(await ask({ title: 'entfernen', text: `"${item.title}" entfernen?`, ok: 'entfernen', danger: true }))) return;
  W.remove(item.id);
  items = items.filter((i) => i.id !== item.id);
  render();
  status(`entfernt: ${item.title}`);
}

$('#add').addEventListener('submit', (e) => {
  e.preventDefault();
  const raw = $('#url').value.trim();
  if (!raw) return $('#url').focus();
  // geteilter Text wie "Schau mal: https://shop…/produkt" -> nur den Link nehmen
  const m = raw.match(/https?:\/\/[^\s<>"']+/i) || raw.match(/^(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)+\/\S*/i);
  if (!m) return status('kein gültiger link gefunden', 'err');
  const url = /^https?:/i.test(m[0]) ? m[0].replace(/[),.;!]+$/, '') : `https://${m[0]}`;
  $('#url').value = url;
  addItem(url);
});
$('#refresh').addEventListener('click', () => refreshAll(false));
$('#new-list').addEventListener('click', newList);
$('#rename-list').addEventListener('click', renameList);
$('#delete-list').addEventListener('click', deleteList);

/* ------------------------------------------------------------ Login */

const A = W.account;

function loginStatus(text, state = '') {
  const el = $('#login-status');
  el.hidden = !text; // Zeile nur bei einer Meldung zeigen
  el.textContent = text;
  el.dataset.state = state;
}

function showLogin(msg) {
  document.body.classList.add('locked');
  $('#login').hidden = false;
  $('#userline').hidden = true;
  $('#whoami').textContent = '–';
  loginStatus(msg || '');
  setTimeout(() => $('#login-user').focus(), 50);
}

// Liste der aktiven Sitzung anzeigen und Preise aktualisieren
function startApp() {
  document.body.classList.remove('locked');
  $('#login').hidden = true;
  const user = A.user();
  $('#userline').hidden = !user;
  $('#whoami').textContent = user ? user.toUpperCase() : '–';
  run++;
  refreshing = null;
  busy.clear();
  cards.clear();
  $('#refresh').disabled = false;
  items = W.all();
  renderLists();
  render();
  // Nur beim Öffnen der Seite (bzw. Anmelden): Preise ALLER Listen neu laden
  if (!navigator.onLine) status('offline – preise werden beim nächsten öffnen mit internet aktualisiert');
  else if (W.lists().some((l) => l.count)) refreshAll(true);
  else status('bereit. füg oben einen produktlink ein.');
  takeShare();
}

async function signIn() {
  const user = $('#login-user').value.trim();
  if (!user) return $('#login-user').focus();
  $('#login-btn').disabled = true;
  loginStatus('melde an …', 'busy');
  try {
    const { migrated } = await A.signIn(user);
    startApp();
    if (migrated) status(`deine bisherigen listen wurden in das konto "${A.user()}" übernommen`, 'ok');
  } catch (e) {
    loginStatus(`fehler: ${e.message}`, 'err');
  } finally {
    $('#login-btn').disabled = false;
  }
}

$('#login-form').addEventListener('submit', (e) => {
  e.preventDefault();
  signIn();
});
$('#logout').addEventListener('click', async () => {
  if (!(await ask({ title: 'logout', text: 'wirklich abmelden?', ok: 'abmelden', danger: true }))) return;
  run++;
  refreshing = null;
  await A.signOut();
  showLogin('abgemeldet');
});
A.onSessionLost(() => {
  run++;
  refreshing = null;
  showLogin('sitzung abgelaufen – bitte neu anmelden');
});

/* ------------------------------------------------------------ App */

// Aus dem "Teilen"-Menü einer anderen App: /?url=…&text=…&title=… -> Link automatisch hinzufügen
const shareParams = new URLSearchParams(location.search);
let pendingShare = ['url', 'text', 'title'].map((k) => shareParams.get(k) || '').join(' ').trim() || null;
// App-Kurzbefehl "Produkt hinzufügen" (langes Tippen aufs Icon): /?add -> gleich ins Eingabefeld
const wantsAdd = shareParams.has('add');
if (pendingShare || wantsAdd) history.replaceState(null, '', location.pathname);

function takeShare() {
  if (wantsAdd && !pendingShare) {
    $('#url').focus();
    $('#add').scrollIntoView({ block: 'center' });
    return;
  }
  if (!pendingShare) return;
  $('#url').value = pendingShare;
  pendingShare = null;
  $('#add').requestSubmit();
}

/*
 * App installieren.
 * Der Knopf ist sichtbar, solange die App nicht als App läuft. Chrome/Edge liefern nicht immer ein
 * Installations-Ereignis (z.B. nach einmal "Abbrechen" oder in anderen Browsern) – dann zeigt der Knopf
 * eine Anleitung für genau dieses Gerät.
 */
const INSTALLED_KEY = 'wishly.installed';
let installPrompt = null;
const runningAsApp = () =>
  matchMedia('(display-mode: standalone)').matches ||
  matchMedia('(display-mode: fullscreen)').matches ||
  matchMedia('(display-mode: minimal-ui)').matches ||
  navigator.standalone === true;
const storedInstalled = () => {
  try {
    return localStorage.getItem(INSTALLED_KEY) === '1';
  } catch {
    return false;
  }
};
function updateInstallButton() {
  // in der App selbst nie; im Browser nur, wenn nicht schon installiert (oder der Browser sagt, dass es geht)
  $('#install-line').hidden = runningAsApp() || (storedInstalled() && !installPrompt);
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  installPrompt = e; // der Browser bietet die Installation an -> sicher noch nicht installiert
  try {
    localStorage.removeItem(INSTALLED_KEY);
  } catch {}
  updateInstallButton();
});
window.addEventListener('appinstalled', () => {
  installPrompt = null;
  try {
    localStorage.setItem(INSTALLED_KEY, '1');
  } catch {}
  updateInstallButton();
  status('wishly installiert – du findest die app jetzt bei deinen apps', 'ok');
});
matchMedia('(display-mode: standalone)').addEventListener?.('change', updateInstallButton);

function installSteps() {
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) return 'unten in der leiste auf teilen (□↑) tippen\n→ „zum home-bildschirm“\n→ „hinzufügen“';
  if (/SamsungBrowser/.test(ua)) return 'unten rechts auf menü (☰) tippen\n→ „seite hinzufügen zu“\n→ „startbildschirm“';
  if (/Android/.test(ua) && /Firefox/.test(ua)) return 'oben rechts auf ⋮ tippen\n→ „installieren“\n(oder „zum startbildschirm hinzufügen“)';
  if (/Android/.test(ua)) return 'oben rechts auf ⋮ tippen\n→ „app installieren“\n(oder „zum startbildschirm hinzufügen“)\n→ „installieren“';
  if (/Edg\//.test(ua)) return 'oben rechts auf … klicken\n→ „apps“\n→ „diese website als app installieren“';
  if (/Chrome\//.test(ua)) return 'rechts in der adressleiste auf das installieren-symbol (⊕) klicken\noder: ⋮ → „streamen, speichern und teilen“ → „seite als app installieren“';
  if (/Safari\//.test(ua) && /Mac/.test(ua)) return 'oben im menü: ablage → „zum dock hinzufügen“';
  return 'dieser browser kann keine apps installieren.\nöffne die seite in chrome oder edge.';
}

$('#install').addEventListener('click', async () => {
  if (installPrompt) {
    const p = installPrompt;
    installPrompt = null;
    p.prompt();
    const choice = await p.userChoice.catch(() => null);
    if (choice?.outcome === 'accepted') {
      try {
        localStorage.setItem(INSTALLED_KEY, '1');
      } catch {}
    }
    updateInstallButton();
    return;
  }
  await ask({ title: 'app installieren', text: `so installierst du wishly:\n\n${installSteps()}`, ok: 'verstanden', cancel: false });
});
updateInstallButton();

// In der installierten App gibt es kein "Neu laden": kommt sie nach 30 Min. wieder in den Vordergrund, zählt das wie Öffnen
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return void (hiddenAt = Date.now());
  if (runningAsApp() && hiddenAt && Date.now() - hiddenAt > 30 * 60e3 && navigator.onLine && !document.body.classList.contains('locked')) {
    refreshAll(true);
  }
});

// Service Worker: App startet schnell und auch kurz ohne Netz
if ('serviceWorker' in navigator && !shareParams.has('embed') && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// Eingebettet in test.html (?embed): nichts laden, nichts aktualisieren
if (!new URLSearchParams(location.search).has('embed')) {
  (async () => {
    const { online, user } = await A.detect();
    if (!online) return startApp(); // ohne Worker: alles bleibt im Browser, kein Login
    if (!user) return showLogin();
    try {
      // neuesten Stand vom Worker holen (max. 5 s), sonst Zwischenspeicher nehmen
      await Promise.race([A.pull(), new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 5000))]);
    } catch {
      /* offline oder langsam: Zwischenspeicher bleibt */
    }
    if (A.user()) startApp(); // Sitzung abgelaufen -> Login wird schon angezeigt
  })();
}
