<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wishly</title>
  <meta name="description" content="Wishly – Gaming-Wunschliste: Produktlink einfügen, Foto, Name und aktuellen Preis sehen.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Wishly">
  <meta name="application-name" content="Wishly">
  <style>
  /* Stil wie der Enchantment Tracker: Pixel-Schrift, dunkle Kästen, 2px-Rahmen, weißes Leuchten */
  :root {
    --bg: #111111;
    --surface: #1e1e1e;
    --border: #333333;
    --border2: #555555;
    --text: #e0e0e0;
    --text-muted: #888888;
    --text-dim: #444444;
    --done-bg: #262626;
    --done-border: #6e6e6e;
    --green: #55ff55;
    --green-bg: #142214;
    --red: #ff5555;
    --red-bg: #221414;
    --pixel: 'Press Start 2P', monospace;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  html { -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--pixel);
    font-size: 10px;
    line-height: 1.8;
    min-height: 100vh;
    padding: 36px 16px;
  }

  button, input { font-family: var(--pixel); color: inherit; }
  a { color: inherit; }
  ::selection { background: #888; color: #000; }

  .page { max-width: 700px; margin: 0 auto; }

  /* HEADER */
  header { text-align: center; margin-bottom: 32px; }
  header h1 {
    font-size: 16px;
    color: var(--text);
    margin-bottom: 12px;
    letter-spacing: 3px;
    font-weight: 400;
    text-shadow: 0 0 12px rgba(255,255,255,0.5), 3px 3px 0 #000;
    animation: glow 3s ease-in-out infinite;
  }
  header h1 span { color: #ffffff; }
  @keyframes glow {
    0%, 100% { text-shadow: 0 0 10px rgba(255,255,255,0.35), 3px 3px 0 #000; }
    50%       { text-shadow: 0 0 30px rgba(255,255,255,0.85), 0 0 60px rgba(255,255,255,0.25), 3px 3px 0 #000; }
  }
  .subtitle { font-size: 8px; color: var(--text-muted); }
  .userline { margin-top: 12px; font-size: 7px; color: var(--text-muted); display: flex; justify-content: center; align-items: center; gap: 12px; }
  .userline b { color: var(--text); font-weight: 400; }

  /* BUTTONS (wie reset-btn) */
  .btn {
    background: none;
    border: 2px solid var(--border2);
    color: var(--text-muted);
    font-size: 7px;
    line-height: 1.6;
    padding: 7px 12px;
    cursor: pointer;
    text-transform: uppercase;
    text-decoration: none;
    display: inline-block;
    transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .btn:hover { border-color: #aaaaaa; color: #cccccc; }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn--green { border-color: var(--green); color: var(--green); }
  .btn--green:hover { border-color: var(--green); color: #9dff9d; box-shadow: 0 0 12px rgba(85,255,85,0.3); }
  .btn--red { border-color: var(--red); color: var(--red); }
  .btn--red:hover { border-color: var(--red); color: #ff9a9a; box-shadow: 0 0 12px rgba(255,85,85,0.3); }
  .btn--small { padding: 5px 8px; font-size: 6px; }

  /* BOX (wie progress-wrap) */
  .box {
    background: var(--surface);
    border: 2px solid var(--border);
    padding: 16px;
    margin-bottom: 24px;
  }
  .box__head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
  .label { font-size: 8px; color: var(--text-muted); text-transform: uppercase; }

  /* GESAMT */
  .total__row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .total__sum { font-size: 18px; color: #ffffff; text-shadow: 0 0 12px rgba(255,255,255,0.5), 3px 3px 0 #000; }
  .total__count { font-size: 8px; color: var(--text-muted); }

  /* LISTEN */
  .lists__tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .lists__tab small { color: var(--text-dim); margin-left: 6px; font-size: 6px; }
  .lists__tab[aria-current="true"] {
    background: var(--done-bg);
    border-color: var(--done-border);
    color: #ffffff;
    box-shadow: 0 0 10px rgba(255,255,255,0.25);
  }
  .lists__tab[aria-current="true"] small { color: #999; }
  .lists__actions { display: flex; flex-wrap: wrap; gap: 8px; }

  /* PRODUKT HINZUFÜGEN */
  .field { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
  .input {
    flex: 1 1 240px; min-width: 0;
    background: #0d0d0d;
    border: 2px solid var(--border2);
    color: var(--text);
    font-size: 8px;
    padding: 10px;
    outline: 0;
  }
  .input:focus { border-color: #aaaaaa; box-shadow: 0 0 10px rgba(255,255,255,0.15); }
  .input::placeholder { color: var(--text-dim); }
  .statusline { margin-top: 10px; font-size: 7px; color: var(--text-muted); min-height: 1.8em; word-break: break-word; }
  .statusline[data-state="ok"] { color: var(--green); }
  .statusline[data-state="err"] { color: var(--red); }
  .statusline[data-state="busy"] { color: var(--text); }
  .statusline[hidden] { display: none; }

  /* SECTION */
  .section-title {
    font-size: 9px;
    color: #c8c8c8;
    border-bottom: 2px solid var(--border2);
    padding-bottom: 10px;
    margin-bottom: 14px;
    letter-spacing: 3px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    text-shadow: 0 0 8px rgba(255,255,255,0.3);
    text-transform: uppercase;
  }
  .section-title { flex-wrap: nowrap; }
  .section-title #list-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .section-title .tools { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; letter-spacing: 0; text-shadow: none; }

  /* PRODUKTE */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 2px solid var(--border);
    display: flex; flex-direction: column;
    transition: border-color 0.12s, box-shadow 0.12s;
    animation: fadeIn 0.3s ease both;
  }
  .card:hover { border-color: var(--border2); box-shadow: 0 0 12px rgba(255,255,255,0.12); }
  .card.loading { animation: enchantGlow 1.2s ease-in-out infinite; }
  @keyframes enchantGlow {
    0%, 100% { box-shadow: 0 0 6px rgba(255,255,255,0.2); }
    50%       { box-shadow: 0 0 22px rgba(255,255,255,0.55), 0 0 44px rgba(255,255,255,0.15); }
  }
  .card__img { position: relative; aspect-ratio: 4 / 3; background: #0d0d0d; border-bottom: 2px solid var(--border); overflow: hidden; }
  .card__img img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; image-rendering: auto; }
  .card__img.noimg::after {
    content: 'KEIN BILD'; position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 7px; color: var(--text-dim);
  }
  .card__idx {
    position: absolute; top: 6px; left: 6px;
    background: var(--done-bg); border: 2px solid var(--done-border);
    color: #fff; font-size: 7px; padding: 2px 6px;
  }
  .card__body { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card__title { font-size: 8px; font-weight: 400; line-height: 1.8; color: var(--text); word-break: break-word; }
  .card__best { font-size: 14px; color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.45), 2px 2px 0 #000; cursor: help; }
  .card.loading .card__best::after { content: ' …'; }
  .card__shop { font-size: 6px; color: var(--text-muted); word-break: break-word; }
  .card__meta { font-size: 6px; color: var(--red); }
  .card__actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }

  .empty { font-size: 8px; color: var(--text-muted); text-align: center; padding: 24px 0; }
  .empty[hidden] { display: none; }

  /* LOGIN */
  body.locked #app { display: none; }
  .login[hidden] { display: none; }
  .login__hint { font-size: 7px; color: var(--text-muted); margin-bottom: 14px; }

  /* FENSTER (wie Admin-Panel, aber neutral) */
  .modal {
    position: fixed; inset: 0; z-index: 60;
    display: grid; place-items: center; padding: 16px;
    background: rgba(0, 0, 0, .75);
  }
  .modal[hidden] { display: none; }
  .modal__box {
    width: min(440px, 100%);
    background: var(--surface);
    border: 2px solid var(--border2);
    padding: 20px;
    box-shadow: 0 0 30px rgba(255,255,255,0.15);
    animation: fadeIn 0.2s ease;
  }
  .modal--danger .modal__box { background: var(--red-bg); border-color: var(--red); box-shadow: 0 0 20px rgba(255,85,85,0.25); }
  .modal__title { font-size: 10px; color: #fff; text-align: center; margin-bottom: 14px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 8px rgba(255,255,255,0.4); }
  .modal--danger .modal__title { color: var(--red); text-shadow: 0 0 8px rgba(255,85,85,0.4); }
  .modal__text { font-size: 8px; color: var(--text); margin-bottom: 14px; word-break: break-word; white-space: pre-line; line-height: 2.2; }
  .modal__field[hidden] { display: none; }
  .modal__field .input { width: 100%; }
  .modal__hint { font-size: 6px; color: var(--text-muted); margin-top: 8px; }
  .modal__hint:empty { display: none; }
  .modal__actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  footer { text-align: center; margin-top: 44px; font-size: 7px; color: var(--text-dim); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  </style>
</head>
<body class="locked">
